<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipulación del DOM con Bootstrap</title>
  <!-- Enlace al CDN de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="js/ejercicio18.js" defer></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="card-title text-center mb-4 text-primary fw-bold">Lista de Tareas</h2>
            
            <!-- Grupo de entrada y botón -->
            <div class="input-group mb-3">
              <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe un elemento...">
              <button class="btn btn-primary" type="button" id="agregarBtn">Agregar</button>
            </div>

            <!-- Contenedor de la lista dinámica -->
            <ul id="lista" class="list-group"></ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
